<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags - Dynamically generated by SSR -->
  <title><!--ssr-title--></title>
  <meta name="description" content="<!--ssr-description-->" />
  <meta name="keywords" content="<!--ssr-keywords-->" />
  <meta name="author" content="TheToolX Team" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  
  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="your-verification-code" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="<!--ssr-url-->" />
  <meta property="og:title" content="<!--ssr-title-->" />
  <meta property="og:description" content="<!--ssr-description-->" />
  <meta property="og:image" content="<!--ssr-image-->" />
  <meta property="og:site_name" content="TheToolX - Free Online Tools" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="<!--ssr-url-->" />
  <meta name="twitter:title" content="<!--ssr-title-->" />
  <meta name="twitter:description" content="<!--ssr-description-->" />
  <meta name="twitter:image" content="<!--ssr-image-->" />
  <meta name="twitter:creator" content="@thetoolx" />

  <!-- Additional SEO -->
  <link rel="canonical" href="<!--ssr-canonical-->" />
  <meta name="theme-color" content="#3b82f6" />
  
  <!-- Mobile App Meta -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TheToolX" />

  <!-- JSON-LD Structured Data - Dynamically generated by SSR -->
  <script type="application/ld+json"><!--ssr-structured-data--></script>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Preconnect to important domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- DNS Prefetch for performance -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <!--ssr-head-->
</head>

<body>
  <style type="text/css">
    body[data-scroll-locked] {
      margin: 0 !important;
      overflow: hidden !important;
    }
    
    /* Prevent FOUC (Flash of Unstyled Content) */
    #root {
      min-height: 100vh;
    }
  </style>
  
  <!-- Noscript fallback -->
  <noscript>
    <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif;">
      <h1>JavaScript Required</h1>
      <p>TheToolX requires JavaScript to be enabled. Please enable JavaScript in your browser settings to use our tools.</p>
    </div>
  </noscript>
  
  <div id="root"><!--ssr-outlet--></div>

  <!-- Initialize theme before hydration to prevent flash -->
  <script>
    (function () {
      try {
        const theme = localStorage.getItem('thetoolx-theme') || 'light';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.add('light');
        }
      } catch (e) {
        document.documentElement.classList.add('light');
      }
    })();
  </script>

  <script type="module" src="/client/src/entry-client.tsx"></script>
  
  <!-- Payment Gateway Scripts (if needed) -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <!-- <script src="https://js.stripe.com/v3/"></script> -->
</body>

</html>
